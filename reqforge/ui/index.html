<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reqforge</title>
<style>
:root{--bg:#f6f6f3;--panel:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#e3e2dd;--accent:#2f5bd3;--accent-ink:#fff;--accent-soft:#e9effd;
--ok:#1f7a4d;--warn:#a86400;--err:#b3261e;--chip:#efeee9;--bar:#d9d8d2;--user:#2f5bd3;--user-ink:#fff;
--k-create-bg:#dff3e8;--k-create:#1f7a4d;--k-update-bg:#e9effd;--k-update:#2f5bd3;--k-delete-bg:#fbe4e2;--k-delete:#b3261e;
font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#131312;--panel:#1c1c1a;--ink:#ecebe6;--muted:#9c9b94;--line:#32312d;--accent:#7b9cff;--accent-ink:#0d0d0c;--accent-soft:#222a3d;
--ok:#5cc28f;--warn:#e0a24a;--err:#f2867c;--chip:#292825;--bar:#3a3935;--user:#3b5bb5;--user-ink:#fff;
--k-create-bg:#1d3a2b;--k-create:#5cc28f;--k-update-bg:#222a3d;--k-update:#7b9cff;--k-delete-bg:#3d2220;--k-delete:#f2867c}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-size:13.5px;display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:inherit}
header{display:flex;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:700}.proj{color:var(--muted)}
nav{display:flex;gap:2px;flex-wrap:wrap}nav button{background:none;border:0;padding:5px 10px;border-radius:6px;color:var(--muted);cursor:pointer}
nav button.on{background:var(--chip);color:var(--ink);font-weight:600}
.badge{display:inline-block;min-width:16px;padding:0 5px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:11px;margin-left:4px}
.sp{flex:1}.btn{border:1px solid var(--line);background:var(--panel);padding:4px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.danger{color:var(--err)}
.btn:disabled{opacity:.5;cursor:default}.btn.sm{padding:2px 8px;font-size:12px}.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:none}
.app{flex:1;display:grid;grid-template-columns:270px minmax(0,1fr);min-height:0}
.app.chat{grid-template-columns:270px minmax(0,1fr) 410px}
#side{border-right:1px solid var(--line);overflow:auto;padding:10px 8px;background:var(--panel)}
#main{overflow:auto;padding:12px 16px;min-width:0}
#chat{border-left:1px solid var(--line);background:var(--panel);display:none;flex-direction:column;min-height:0}
.app.chat #chat{display:flex}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 6px 4px}
.node{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;cursor:pointer;user-select:none}
.node:hover{background:var(--chip)}.node.on{background:var(--accent-soft);font-weight:600}
.node .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.node .ct{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;min-width:30px;text-align:right}
.node.cat{padding-left:24px}.node.faded{opacity:.55}.caret{width:14px;color:var(--muted);font-size:10px;text-align:center}
.cov{width:36px;height:5px;border-radius:3px;background:var(--bar);overflow:hidden;flex:none}.cov i{display:block;height:100%;background:var(--ok)}
.dot{font-size:11px}.dot.e{color:var(--err)}.dot.w{color:var(--warn)}.gap{color:var(--warn);font-size:11px}
.facet{display:flex;flex-wrap:wrap;gap:4px;padding:0 6px}
.fchip{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:1px 8px;font-size:12px;cursor:pointer}
.fchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.fchip span{opacity:.7;margin-left:4px}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;font-size:13px}
.crumbs .c{color:var(--accent);cursor:pointer}.crumbs .sep{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:2px;background:var(--chip);border-radius:12px;padding:1px 2px 1px 9px;font-size:12px}
.pill button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 5px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.bar input[type=search]{flex:1;min-width:200px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
select,input[type=text],input[type=password],input[type=number],textarea{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--panel)}
.bulk{background:var(--accent-soft);border-radius:8px;padding:6px 10px}
.tbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}
.tbl th,.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.tbl th.s{cursor:pointer}.tbl th.s:hover{color:var(--ink)}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:var(--chip)}.tbl tbody tr.sel{background:var(--accent-soft)}
.id{font-family:var(--mono);font-size:12px;white-space:nowrap}
.stmt{color:var(--muted);font-size:12px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-block;background:var(--chip);border-radius:10px;padding:0 7px;font-size:12px;margin:1px 2px 1px 0;white-space:nowrap}
.s-ok{color:var(--ok)}.s-warn{color:var(--warn)}.s-err{color:var(--err)}.muted{color:var(--muted)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin:8px 0;color:var(--muted)}
aside#drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100vw);background:var(--panel);border-left:1px solid var(--line);
transform:translateX(100%);transition:transform .18s;z-index:30;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.08)}
aside#drawer.open{transform:none}.dh{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.dtabs{display:flex;gap:2px;padding:6px 14px 0}.dtabs button{border:0;background:none;padding:5px 10px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted)}
.dtabs button.on{border-color:var(--accent);color:var(--ink)}
.db{padding:12px 14px;overflow:auto;flex:1}.df{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.f{margin-bottom:10px}.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}.f input,.f select,.f textarea{width:100%}
.f textarea{min-height:64px}.f textarea.code{font-family:var(--mono);font-size:12px;min-height:110px}
.err{color:var(--err);font-size:12.5px;white-space:pre-wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px}.card b{display:block;font-size:19px}.card span{font-size:12px;color:var(--muted)}
h2{font-size:14px;margin:16px 0 8px}h3{font-size:13px;margin:12px 0 6px}ul.plain{margin:4px 0;padding-left:18px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.ch{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.status{width:8px;height:8px;border-radius:50%;background:var(--muted)}.status.ok{background:var(--ok)}.status.bad{background:var(--err)}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{line-height:1.45}.m.user{align-self:flex-end;background:var(--user);color:var(--user-ink);padding:7px 11px;border-radius:12px 12px 2px 12px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.m.asst p{margin:0 0 6px}.m.asst ul{margin:2px 0 6px;padding-left:18px}.m.asst code{font-family:var(--mono);font-size:12px;background:var(--chip);padding:0 4px;border-radius:4px}
.m.asst pre{background:var(--chip);padding:8px;border-radius:6px;overflow:auto;font-size:12px}
.tools{font-size:12px;color:var(--muted)}.tools summary{cursor:pointer}.tools div{padding:1px 0 1px 10px;font-family:var(--mono);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools div.sub{padding-left:22px;opacity:.8}
.m.sys{font-size:12px;color:var(--muted);text-align:center}.m.error{color:var(--err);font-size:12.5px;white-space:pre-wrap}
.choices{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}.choices .q{font-weight:600;margin-bottom:6px}
.choices .opts{display:flex;flex-direction:column;gap:4px}.choices button.opt{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 9px;cursor:pointer}
.choices button.opt:hover{border-color:var(--accent)}.choices.done{opacity:.6;pointer-events:none}
.cs{border:1px solid var(--accent);border-radius:10px;padding:10px 12px;background:var(--panel)}.cs .t{font-weight:700}.cs .vrow{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin:6px 0}
.op{display:flex;gap:6px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line);font-size:12.5px}.op .k{font-size:11px;border-radius:4px;padding:0 5px;font-weight:600}
.k.create{background:var(--k-create-bg);color:var(--k-create)}.k.update{background:var(--k-update-bg);color:var(--k-update)}.k.delete{background:var(--k-delete-bg);color:var(--k-delete)}
.diff{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}.diff del{color:var(--err)}.diff ins{color:var(--ok);text-decoration:none}
.composer{border-top:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.composer textarea{width:100%;min-height:58px;max-height:200px;resize:vertical}.ctx{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
#sideToggle{display:none}
@media (max-width:900px){.app,.app.chat{grid-template-columns:minmax(0,1fr)}#side{display:none;position:fixed;top:48px;left:0;bottom:0;width:280px;z-index:20}
#side.open{display:block}#sideToggle{display:inline-block}.app.chat #chat{position:fixed;inset:0;z-index:40}.tbl .hm{display:none}}
</style>
</head>
<body>
<header>
  <button class="btn sm" id="sideToggle" aria-label="categories">☰</button>
  <h1>reqforge</h1><span class="proj" id="proj"></span>
  <nav id="tabs"></nav><span class="sp"></span>
  <input type="password" id="token" placeholder="API token" style="display:none;width:130px">
  <button class="btn" id="syncBtn" title="commit, pull --rebase, push">Sync</button>
  <button class="btn primary" id="chatBtn">Chat with Claude</button>
</header>
<div class="app" id="app">
  <div id="side"></div>
  <div id="main"></div>
  <div id="chat">
    <div class="ch"><span class="status" id="cstat"></span><b>Claude</b><span class="muted" id="cinfo"></span><span class="sp"></span>
      <button class="btn sm" id="newChat" title="start a fresh conversation">New</button><button class="btn sm" id="closeChat" aria-label="close chat">✕</button></div>
    <div id="msgs"></div>
    <div class="composer">
      <div class="ctx"><label><input type="checkbox" id="useCtx" checked> include view &amp; selection</label><span id="ctxText"></span></div>
      <textarea id="input" placeholder="Ask about, add, refine or remove requirements…  (Enter to send, Shift+Enter for a new line)"></textarea>
      <div style="display:flex;gap:6px"><span class="muted" style="font-size:11.5px;align-self:center">Changes arrive as changesets you review and apply.</span><span class="sp"></span>
        <button class="btn" id="stopBtn" style="display:none">Stop</button><button class="btn primary" id="sendBtn">Send</button></div>
    </div>
  </div>
</div>
<aside id="drawer"><div class="dh"><b id="dTitle"></b><span class="sp"></span><button class="btn sm" id="dAsk">Ask Claude</button><button class="btn sm" id="dClose" aria-label="close">✕</button></div>
<div class="dtabs" id="dTabs"></div><div class="db" id="dBody"></div><div class="df" id="dFoot"></div></aside>
<div class="toast" id="toast"></div>
<script>
// ------------------------------------------------------------------ basics
const KINDS={requirements:"Requirements",epics:"Epics",stories:"Stories",tasks:"Tasks"};
const COLS={requirements:["title","category","priority","status","_stories","_children","tags"],epics:["title","requirements","status","tags"],
  stories:["title","epic","requirements","component","_evals","_tasks","status"],tasks:["title","story","kind","status","estimate"]};
const LABEL={_stories:"stories",_children:"children",_evals:"evals",_tasks:"tasks"};
const HIDE_MOBILE=["tags","requirements","story","epic","component","_children"];
const SIDE_FACETS={requirements:["status","priority","tags"],epics:["status","tags"],stories:["status","deliverable","component","tags"],tasks:["kind","status","tags"]};
const $=s=>document.querySelector(s);
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const[k,v]of Object.entries(a||{})){
  if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="value")e.value=v??"";else if(k==="html")e.innerHTML=v;else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v)}
  for(const x of c.flat(9))if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(x));return e};
const ls={get:(k,d=null)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Number(n||0).toLocaleString();
const fill=(el,...kids)=>el.replaceChildren(...kids.flat(9).filter(x=>x!=null&&x!==false&&x!==""));
const kindOf=id=>({REQ:"requirements",EPIC:"epics",STORY:"stories",TASK:"tasks"})[String(id).split("-")[0]];
function authHeaders(){const t=ls.get("reqforge.token");return t?{Authorization:"Bearer "+t}:{}}
async function api(method,path,body,raw){const headers=authHeaders();let data;
  if(body!==undefined){headers["Content-Type"]=raw?"text/csv":"application/json";data=raw?body:JSON.stringify(body)}
  const r=await fetch(path,{method,headers,body:data});
  if(r.status===401){$("#token").style.display="";throw new Error("unauthorized: enter the API token (REQFORGE_TOKEN)")}
  const out=(r.headers.get("content-type")||"").includes("json")?await r.json():await r.text();
  if(!r.ok){const e=new Error(out.error||r.statusText);e.details=out.details||[];throw e}return out}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),3000)}
let META=null;
const S={tab:"requirements",q:"",filters:{},sort:"id",order:"asc",offset:0,limit:ls.get("reqforge.limit",100),sel:new Set(),selAll:false,
  total:0,rows:[],facets:null,open:new Set(ls.get("reqforge.open",[])),lint:{rule:"",severity:"",offset:0},pending:0};
const sch=(k,f)=>META.schemas[k][f];
const qs=o=>new URLSearchParams(Object.fromEntries(Object.entries(o).filter(([,v])=>v!==""&&v!=null))).toString();
const idLink=id=>h("button",{class:"link id",onclick:e=>{e.stopPropagation();openDrawer(kindOf(id),id)}},id);
function linkify(text){return String(text).split(/((?:REQ|EPIC|STORY|TASK)-\d{4,})/).map((p,i)=>i%2?idLink(p):p)}

// ------------------------------------------------------------------ navigation
function setTab(t){S.tab=t;S.q="";S.filters={};S.offset=0;S.sel.clear();S.selAll=false;S.sort="id";S.order="asc";S.lint={rule:"",severity:"",offset:0};ls.set("reqforge.tab",t);render()}
function setFilter(f,v){if(v===""||v==null)delete S.filters[f];else S.filters[f]=v;S.offset=0;S.lint.offset=0;S.sel.clear();S.selAll=false;render()}
function toggleFacet(f,v){const cur=(S.filters[f]||"").split("|").filter(Boolean);const i=cur.indexOf(v);i>=0?cur.splice(i,1):cur.push(v);setFilter(f,cur.join("|"))}
function tabs(){$("#tabs").replaceChildren(...[...Object.entries(KINDS),["trace","Traceability"],["lint","Lint"],["changes","Changes"]].map(([k,l])=>
  h("button",{class:S.tab===k?"on":"",onclick:()=>setTab(k)},l,k==="changes"&&S.pending?h("span",{class:"badge"},S.pending):null)))}
async function refreshPending(){try{S.pending=(await api("GET","/api/changesets?status=pending")).length;tabs()}catch{}}
function render(){tabs();updateCtx();if(S.tab==="trace")return renderTrace();if(S.tab==="lint")return renderLint();if(S.tab==="changes")return renderChanges();return renderList()}

// ------------------------------------------------------------------ sidebar
function covBar(cov,n){const p=n?Math.round(100*cov/n):0;return h("span",{class:"cov",title:`${cov}/${n} linked to stories (${p}%)`},h("i",{style:`width:${p}%`}))}
function health(e,w){return [e?h("span",{class:"dot e",title:`${e} lint errors`},"●"+fmt(e)):null,w?h("span",{class:"dot w",title:`${w} lint warnings`},"●"+fmt(w)):null]}
function renderSide(){const side=$("#side"),k=S.tab==="lint"?"requirements":S.tab,F=S.facets||{};const out=[];
  if(k==="requirements"&&F._tree){const total=F._tree.reduce((a,n)=>a+n.count,0);
    out.push(h("div",{class:"sec"},"Categories"),
      h("div",{class:"node"+(!S.filters.type?" on":""),onclick:()=>{delete S.filters.category;setFilter("type","")}},h("span",{class:"caret"}),h("span",{class:"nm"},"All requirements"),h("span",{class:"ct"},fmt(total))));
    for(const n of F._tree){const open=S.open.has(n.type)||S.filters.type===n.type;
      out.push(h("div",{class:"node"+(S.filters.type===n.type&&!S.filters.category?" on":""),onclick:()=>{delete S.filters.category;setFilter("type",n.type)}},
        h("span",{class:"caret",onclick:e=>{e.stopPropagation();open?S.open.delete(n.type):S.open.add(n.type);ls.set("reqforge.open",[...S.open]);renderSide()}},open?"▾":"▸"),
        h("span",{class:"nm"},n.type),...health(n.errors,0),covBar(n.covered,n.count),h("span",{class:"ct"},fmt(n.count))));
      if(open)for(const c of n.categories){const gap=!c.count&&!c.waived;
        out.push(h("div",{class:"node cat"+(S.filters.category===c.category?" on":"")+(c.waived&&!c.count?" faded":""),title:c.waived?`waived: ${c.waived}`:gap?"coverage gap: no requirement and no waiver":"",
          onclick:()=>{S.filters.type=n.type;setFilter("category",c.category)}},
          h("span",{class:"nm"},c.category),gap?h("span",{class:"gap"},"gap"):c.waived&&!c.count?h("span",{class:"muted",style:"font-size:11px"},"waived"):null,
          ...health(c.errors,c.warnings),c.count?covBar(c.covered,c.count):null,h("span",{class:"ct"},fmt(c.count))))}}
    if(S.tab==="requirements")out.push(h("div",{class:"sec"},"Traceability"),h("div",{class:"facet"},
      ...[["no","Not linked to a story"],["yes","Linked"]].map(([v,l])=>h("button",{class:"fchip"+(S.filters.covered===v?" on":""),onclick:()=>setFilter("covered",S.filters.covered===v?"":v)},l))))}
  if(k==="stories"&&F.epic){out.push(h("div",{class:"sec"},"Epics"),h("div",{class:"node"+(!S.filters.epic?" on":""),onclick:()=>setFilter("epic","")},h("span",{class:"nm"},"All epics")));
    for(const[e,c]of Object.entries(F.epic))out.push(h("div",{class:"node"+(S.filters.epic===e?" on":""),onclick:()=>setFilter("epic",e)},
      h("span",{class:"nm",title:F._epic_titles?.[e]||""},`${e} ${F._epic_titles?.[e]||""}`),h("span",{class:"ct"},fmt(c))))}
  if(S.tab!=="lint")for(const f of SIDE_FACETS[k]||[]){const vals=Object.entries(F[f]||{}).slice(0,f==="tags"?24:50);if(!vals.length)continue;
    const on=(S.filters[f]||"").split("|");
    out.push(h("div",{class:"sec"},f),h("div",{class:"facet"},...vals.map(([v,c])=>h("button",{class:"fchip"+(on.includes(v)?" on":""),onclick:()=>toggleFacet(f,v)},v,h("span",{},fmt(c))))))}
  side.replaceChildren(...out)}

// ------------------------------------------------------------------ list view
function crumbs(){const k=S.tab==="lint"?"requirement findings":S.tab;const parts=[h("span",{class:"c",onclick:()=>{S.filters={};S.q="";S.offset=0;S.lint.offset=0;render()}},`All ${k}`)];
  if(S.filters.type)parts.push(h("span",{class:"sep"},"›"),h("span",{class:"c",onclick:()=>{delete S.filters.category;render()}},S.filters.type));
  if(S.filters.category)parts.push(h("span",{class:"sep"},"›"),h("b",{},S.filters.category));
  if(S.filters.parent)parts.push(h("span",{class:"sep"},"›"),h("b",{},`children of ${S.filters.parent}`));
  const extra=Object.entries(S.filters).filter(([f])=>!["type","category","parent"].includes(f));

async function changesetCard(id){let cs;try{cs=await api("GET",`/api/changesets/${id}`)}catch(e){return h("div",{class:"m error"},e.message)}
  const a=cs.analysis||{},L=a.lint||{},T=a.trace||{},im=a.impact||{},notes=cs.impact_notes||{};const excl=new Set();
  const ok=(b,t,f)=>h("span",{class:b?"s-ok":"s-err"},(b?"✓ ":"✗ ")+(b?t:f));
  const ops=(a.ops||[]).map(o=>h("div",{class:"op"},cs.status==="pending"?h("input",{type:"checkbox",checked:true,title:"include this operation","aria-label":"include op",onchange:e=>{e.target.checked?excl.delete(o.i):excl.add(o.i)}}):null,
    h("span",{class:"k "+o.op},o.op),h("div",{style:"flex:1;min-width:0"},cs.status==="applied"||o.op!=="create"?idLink(o.id):h("span",{class:"id"},o.id),
      o.ref?h("span",{class:"muted"},` ($${o.ref})`):null," ",o.title||"",
      o.reason?h("div",{class:"muted",style:"font-size:12px"},o.reason):null,
      o.op==="create"&&o.data?.statement?h("div",{class:"diff"},o.data.statement):null,
      ...Object.entries(o.changes||{}).map(([f,d])=>diffLine(f,d)))));
  const imp=[["stories",im.stories,x=>idLink(x.id)],["tasks",im.tasks,x=>idLink(x.id)],["evals",im.evals,x=>[idLink(x.story),`/${x.id}`]]].filter(([,v])=>v&&v.length);
  const card=h("div",{class:"cs"},
    h("div",{style:"display:flex;gap:8px;align-items:center"},h("span",{class:"id"},cs.id),h("span",{class:"t"},cs.title),h("span",{class:"sp"}),
      h("span",{class:"chip "+(cs.status==="pending"?"s-warn":cs.status==="applied"?"s-ok":"muted")},cs.status)),
    cs.summary?h("p",{style:"margin:6px 0"},cs.summary):null,
    h("div",{class:"vrow"},ok(a.valid,"valid","invalid"),ok(L.mece_ok,"MECE holds",`MECE: ${(L.new||[]).length} new findings`),
      h("span",{class:T.ok_after?"s-ok":"s-warn"},`trace ${T.ok_before?"pass":"fail"} → ${T.ok_after?"pass":"fail"}`),
      h("span",{class:"muted"},`gaps ${L.gaps_before} → ${L.gaps_after}`),h("span",{class:"muted"},`lint errors ${L.before?.error} → ${L.after?.error}`)),
    (a.errors||[]).length?h("div",{class:"err"},...a.errors.map(e=>h("div",{},"• "+e))):null,
    h("h3",{},`${(a.ops||[]).length} operations`),...ops,
    (L.new||[]).length?h("details",{},h("summary",{class:"s-warn"},`${L.new.length} new lint findings`),h("ul",{class:"plain"},...L.new.slice(0,50).map(f=>h("li",{},`${f.rule}: `,...f.ids.map(i=>[idLink(i)," "]),`— ${f.message}`)))):null,
    (L.resolved||[]).length?h("div",{class:"s-ok",style:"font-size:12px"},`resolves ${L.resolved.length} existing lint findings`):null,
    (T.delta||[]).length?h("details",{},h("summary",{},"Traceability changes"),h("ul",{class:"plain"},...T.delta.map(d=>h("li",{},`${d.name}: `,
      d.new_failures.length?h("span",{class:"s-err"},`+${d.new_failures.length} failing `):null,d.fixed.length?h("span",{class:"s-ok"},`${d.fixed.length} fixed`):null,
      d.new_failures.length?h("div",{class:"muted",style:"font-size:12px"},d.new_failures.slice(0,5).join("; ")):null)))):null,
    h("h3",{},"Impact"),
    h("div",{class:"vrow"},...imp.map(([k,v])=>h("span",{},`${v.length} ${k}`)),im.components?.length?h("span",{},"components: "+im.components.join(", ")):null,
      im.in_progress_work?.length?h("span",{class:"s-warn"},`touches in-progress/done work: ${im.in_progress_work.slice(0,10).join(", ")}`):null),
    imp.length?h("details",{},h("summary",{},"affected records"),...imp.map(([k,v,fn])=>h("div",{style:"font-size:12px;margin:4px 0"},h("b",{},k+": "),...v.slice(0,40).map(x=>[fn(x)," "])))):null,
    ...["stories","code","evals"].filter(k=>notes[k]).map(k=>h("div",{style:"font-size:12.5px;margin:3px 0"},h("b",{},k+": "),notes[k])),
    (notes.risks||[]).length?h("div",{style:"font-size:12.5px"},h("b",{},"risks: "),h("ul",{class:"plain"},...notes.risks.map(r=>h("li",{},r)))):null,
    cs.status==="pending"?h("div",{style:"display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"},
      h("button",{class:"btn primary",disabled:!a.valid,title:a.valid?"":"fix the errors first (ask Claude to revise)",onclick:async e=>{e.target.disabled=true;
        try{const res=await api("POST",`/api/changesets/${cs.id}/apply`,{exclude:[...excl]});toast(`${cs.id} applied`);refreshPending();
          card.replaceWith(await changesetCard(cs.id));if(KINDS[S.tab])renderList();
          if(chat.sessionId)send(`I applied ${cs.id}${excl.size?` (excluding ops ${[...excl].join(", ")})`:""}. Result: ${JSON.stringify({assigned_ids:res.assigned_ids,lint:res.lint,trace_ok:res.trace_ok,
            failing_checks:res.failing_checks.map(c=>({check:c.check,count:c.failures.length,sample:c.failures.slice(0,5)}))})}. Verify traceability on the new state and propose any follow-up remapping.`,{noCtx:true})}
        catch(err){toast(err.message);e.target.disabled=false;card.append(h("div",{class:"err"},[err.message,...(err.details||[])].join("\n")))}}},"Apply"),
      h("button",{class:"btn",onclick:()=>{openChat();$("#input").value=`Revise ${cs.id}: `;$("#input").focus()}},"Ask to revise"),
      h("button",{class:"btn danger",onclick:async()=>{try{await api("POST",`/api/changesets/${cs.id}/reject`,{reason:"rejected in UI"});toast(`${cs.id} rejected`);refreshPending();
        card.replaceWith(await changesetCard(cs.id));if(chat.sessionId)send(`I rejected ${cs.id}.`,{noCtx:true})}catch(err){toast(err.message)}}},"Reject")):
      cs.status==="stale"?h("p",{class:"s-warn"},"Stale: records changed after this was proposed. "+(cs.stale_reasons||[]).join("; ")):null);
  return card}

// ------------------------------------------------------------------ chat
const chat={sessionId:ls.get("reqforge.chat.session"),log:ls.get("reqforge.chat.log",[]),busy:false,chatId:null};
function openChat(){$("#app").classList.add("chat");ls.set("reqforge.chat.open",true);$("#input").focus();scrollChat()}
function closeChat(){$("#app").classList.remove("chat");ls.set("reqforge.chat.open",false)}
function askClaude(text){openChat();$("#input").value=text;$("#input").focus()}
function scrollChat(){const m=$("#msgs");m.scrollTop=m.scrollHeight}
function persist(){ls.set("reqforge.chat.log",chat.log.slice(-200).map(({_el,...e})=>e));ls.set("reqforge.chat.session",chat.sessionId)}
function ctxObj(){if(!$("#useCtx").checked)return null;const view={tab:S.tab,...S.filters};if(S.q)view.query=S.q;
  return {view,selected:[...S.sel].slice(0,200),selected_total:S.selAll?S.total:S.sel.size}}
function updateCtx(){const c=ctxObj();$("#ctxText").textContent=c?([c.view.type,c.view.category].filter(Boolean).join(" › ")||c.view.tab)+(c.selected_total?` · ${fmt(c.selected_total)} selected`:""):""}
function md(text){const blocks=[];let t=esc(text).replace(/```(\w*)\n([\s\S]*?)```/g,(_,l,code)=>{blocks.push(`<pre>${code}</pre>`);return `\u0000${blocks.length-1}\u0000`});
  t=t.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/^#{1,4} (.*)$/gm,"<b>$1</b>");
  let html="",inList=false;
  for(const ln of t.split("\n")){const li=ln.match(/^\s*(?:[-*]|\d+\.) (.*)/);if(li){if(!inList){html+="<ul>";inList=true}html+=`<li>${li[1]}</li>`}
    else{if(inList){html+="</ul>";inList=false}if(ln.trim())html+=`<p>${ln}</p>`}}
  if(inList)html+="</ul>";
  return html.replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[i]).replace(/\b((?:REQ|EPIC|STORY|TASK)-\d{4,})\b/g,'<a href="#" data-id="$1" class="link id">$1</a>')}
function renderMsg(e){
  if(e.role==="user")return h("div",{class:"m user"},e.text);
  if(e.role==="sys")return h("div",{class:"m sys"},e.text);
  if(e.role==="error")return h("div",{class:"m error"},e.text);
  if(e.role==="tools")return h("details",{class:"tools",open:e.live},h("summary",{},`⚙ ${e.items.length} tool call${e.items.length>1?"s":""}${e.live?" …":""}`),...e.items.map(i=>h("div",{class:i.sub?"sub":"",title:i.text},i.text)));
  if(e.role==="changeset"){const ph=h("div",{class:"muted"},`loading ${e.id}…`);changesetCard(e.id).then(c=>{ph.replaceWith(c);if(e._el===ph)e._el=c;scrollChat()});return ph}
  if(e.role==="asst"){const parts=[],re=/```choices\s*([\s\S]*?)```/g;let mm,last=0;
    while((mm=re.exec(e.text))){parts.push({md:e.text.slice(last,mm.index)});try{parts.push({choice:JSON.parse(mm[1])})}catch{parts.push({md:mm[0]})}last=re.lastIndex}
    parts.push({md:e.text.slice(last)});
    const div=h("div",{class:"m asst"});
    parts.forEach((p,pi)=>{if(p.md&&p.md.trim())div.append(h("div",{html:md(p.md)}));
      if(p.choice){const c=p.choice,done=(e.answered||[]).includes(pi),box=h("div",{class:"choices"+(done?" done":"")},h("div",{class:"q"},c.question||"Choose"));
        const opts=h("div",{class:"opts"}),picked=new Set();
        const answer=txt=>{e.answered=[...(e.answered||[]),pi];persist();box.classList.add("done");send(txt)};
        for(const o of c.options||[]){if(c.multi)opts.append(h("label",{},h("input",{type:"checkbox",onchange:ev=>{ev.target.checked?picked.add(o):picked.delete(o)}})," ",o));
          else opts.append(h("button",{class:"opt",onclick:()=>answer(`${c.question} → ${o}`)},o))}
        box.append(opts);if(c.multi)box.append(h("button",{class:"btn sm primary",style:"margin-top:6px",onclick:()=>answer(`${c.question} → ${[...picked].join("; ")||"none"}`)},"Send"));
        div.append(box)}});
    div.querySelectorAll("a[data-id]").forEach(a=>a.onclick=ev=>{ev.preventDefault();openDrawer(kindOf(a.dataset.id),a.dataset.id)});
    return div}
  return h("div",{})}
function drawChat(){const m=$("#msgs");
  fill(m,...(chat.log.length?chat.log.map(e=>{const el=renderMsg(e);e._el=el;return el}):[h("div",{class:"m sys"},
    "Ask Claude to add, refine, merge or remove requirements. It reviews what exists, loops on MECE and traceability checks, assesses impact on stories, evals and code components, then proposes a changeset for you to apply.")]));scrollChat()}
function push(e){if(!chat.log.length)$("#msgs").replaceChildren();chat.log.push(e);persist();const el=renderMsg(e);e._el=el;$("#msgs").append(el);scrollChat();return e}
function rerender(e){const el=renderMsg(e);e._el.replaceWith(el);e._el=el;scrollChat()}
async function send(text,opts={}){text=(text||"").trim();if(!text||chat.busy)return;
  chat.busy=true;$("#sendBtn").disabled=true;$("#stopBtn").style.display="";if(!opts.keepInput)$("#input").value="";
  push({role:"user",text});chat.chatId=Math.random().toString(36).slice(2);let tools=null;
  const endTools=()=>{if(tools){tools.live=false;rerender(tools);tools=null}};
  try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json",...authHeaders()},
      body:JSON.stringify({chat_id:chat.chatId,message:text,session_id:chat.sessionId,context:opts.noCtx?null:ctxObj()})});
    if(!r.ok)throw new Error((await r.text())||r.statusText);
    const reader=r.body.getReader(),dec=new TextDecoder();let buf="";
    for(;;){const{value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf("\n\n"))>=0){const chunk=buf.slice(0,i);buf=buf.slice(i+2);
        for(const line of chunk.split("\n")){if(!line.startsWith("data: "))continue;const ev=JSON.parse(line.slice(6));
          if(ev.type==="session"){chat.sessionId=ev.session_id;persist()}
          else if(ev.type==="tool"){if(!tools)tools=push({role:"tools",items:[],live:true});tools.items.push({text:ev.text,sub:ev.sub});rerender(tools);persist()}
          else if(ev.type==="text"){endTools();push({role:"asst",text:ev.text})}
          else if(ev.type==="changeset"){endTools();push({role:"changeset",id:ev.id});refreshPending()}
          else if(ev.type==="warning")push({role:"sys",text:ev.text});
          else if(ev.type==="error"){endTools();push({role:"error",text:ev.text})}
          else if(ev.type==="done"){if(ev.session_id){chat.sessionId=ev.session_id;persist()}if(ev.is_error&&ev.result)push({role:"error",text:ev.result});
            $("#cinfo").textContent=ev.cost!=null?`· $${Number(ev.cost).toFixed(3)} last turn`:""}}}}}
  catch(e){push({role:"error",text:e.message})}
  finally{endTools();chat.busy=false;$("#sendBtn").disabled=false;$("#stopBtn").style.display="none";persist();refreshPending()}}
$("#sendBtn").onclick=()=>send($("#input").value);
$("#input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send($("#input").value)}});
$("#stopBtn").onclick=()=>api("POST","/api/chat/cancel",{chat_id:chat.chatId}).catch(()=>{});
$("#newChat").onclick=()=>{chat.sessionId=null;chat.log=[];persist();drawChat()};
$("#chatBtn").onclick=()=>$("#app").classList.contains("chat")?closeChat():openChat();
$("#closeChat").onclick=closeChat;$("#useCtx").onchange=updateCtx;
$("#dClose").onclick=closeDrawer;
$("#dAsk").onclick=()=>askClaude(`Review ${D.rec.id} (“${D.rec.title}”): is it MECE with its siblings, measurable, correctly classified, and properly traced to stories and evals? Propose a changeset if anything should change.`);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
$("#sideToggle").onclick=()=>$("#side").classList.toggle("open");
$("#token").onchange=e=>{ls.set("reqforge.token",e.target.value);boot()};
$("#syncBtn").onclick=async()=>{try{const r=await api("POST","/api/sync",{});toast(r.ok?(r.pushed?"pushed to GitHub":r.note||"committed"):`sync failed: ${r.error}`)}catch(e){toast(e.message)}};
async function boot(){try{META=await api("GET","/api/meta");$("#proj").textContent=`${META.config.name} (${META.config.key})`;$("#token").style.display="none"}
  catch(e){$("#main").replaceChildren(h("p",{class:"err"},e.message));return}
  api("GET","/api/chat/status").then(s=>{$("#cstat").className="status "+(s.available?"ok":"bad");$("#cstat").title=s.available?`claude: ${s.claude}`:"claude CLI not found on the server's PATH"}).catch(()=>{});
  const t=ls.get("reqforge.tab");if(t&&(KINDS[t]||["trace","lint","changes"].includes(t)))S.tab=t;
  drawChat();if(ls.get("reqforge.chat.open",false))openChat();refreshPending();render()}
boot();
</script>
