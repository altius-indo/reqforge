# reqforge: implements REQ-0043
name: test
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path server/Cargo.toml 2>&1 | tee cargo-test.log
      - name: reqforge self-verification (requirements -> tests -> evidence -> code)
        run: |
          cargo build --release --manifest-path server/Cargo.toml
          bin/reqforge --repo requirements scan
          bin/reqforge --repo requirements evidence ingest cargo-test.log -c server --commit "$GITHUB_SHA" --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          bin/reqforge --repo requirements verify --md --gate >> "$GITHUB_STEP_SUMMARY"
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
